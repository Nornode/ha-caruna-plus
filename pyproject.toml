[project]
name = "ha-caruna-plus-integration"
version = "0.1.0"
description = "Home Assistant custom integration for plus.caruna.fi"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "B905", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLR0917", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
files = ["custom_components/caruna_plus"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "bs4.*", "voluptuous.*", "aioresponses.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
